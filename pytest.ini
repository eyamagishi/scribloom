[pytest]

# 🔍 テスト対象のディレクトリを指定
testpaths = tests

# 🧪 自動検出するテストファイル名パターン（test_*.py に限定）
python_files = test_*.py

# 📋 実行時のデフォルトオプション：
# -rA: 全てのテスト結果を詳細表示（成功、失敗、スキップなど）
# -q: コンパクトな出力で読みやすく
addopts = -rA -q

# 🚫 不要な warning を抑制してログをすっきり表示
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning

# 🏷 任意のマーカーを定義して、pytest -m で対象絞り込み可能に
markers =
    prompt: お題生成ロジックのテスト
    storage: 投稿保存／読み込みに関するテスト
    integration: モジュール間の統合テスト
